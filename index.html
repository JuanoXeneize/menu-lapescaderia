<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Pescadería - Fish Market</title>
    <meta name="description" content="Menú digital de La Pescadería Fish Market. Mariscos, pescados, bebidas y más.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <div class="gold-line top-line"></div>
            <h1 class="logo-title">LA PESCADERÍA</h1>
            <h2 class="logo-subtitle">FISH MARKET</h2>
            <div class="gold-line bottom-line"></div>
        </div>
        <nav class="main-nav">
            <ul id="main-menu">
                <li class="active" data-tab="carta">CARTA</li>
                <li data-tab="bebidas">BEBIDAS</li>
                <li data-tab="vinos">VINOS</li>
                <li data-tab="reservas">RESERVAS</li>
            </ul>
        </nav>
    </header>

    <main class="content-container">
        <!-- CARTA SECTION -->
        <section id="carta" class="menu-section active-section">
            <nav class="sub-nav">
                <ul id="sub-menu">
                    <!-- Options injected by JS -->
                </ul>
            </nav>
            <div id="carta-content">
                <!-- Content will be injected by JS -->
            </div>
        </section>

        <!-- BEBIDAS SECTION -->
        <section id="bebidas" class="menu-section">
            <nav class="sub-nav">
                <ul id="sub-menu-bebidas">
                    <!-- Options injected by JS -->
                </ul>
            </nav>
            <div id="bebidas-content">
                <!-- Content will be injected by JS -->
            </div>
        </section>

        <!-- VINOS SECTION -->
        <section id="vinos" class="menu-section">
            <div class="bodega-selector-container">
                <label for="bodega-select" class="bodega-label">SELECCIONAR BODEGA</label>
                <div class="custom-select-wrapper">
                    <select id="bodega-select" class="bodega-select">
                        <!-- Options injected by JS -->
                    </select>
                </div>
            </div>
            <div id="vinos-content">
                <!-- Content will be injected by JS -->
            </div>
        </section>

        <!-- RESERVAS SECTION -->
        <section id="reservas" class="menu-section reservas-section">
            <div class="reservas-card">
                <div class="reservas-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--gold-accent)" stroke-width="1.5">
                        <path d="M12 8v4l3 3" /><circle cx="12" cy="12" r="10" />
                    </svg>
                </div>
                <h3>RESERVAS</h3>
                <p>Hacé tu reserva contactándonos por WhatsApp o Instagram</p>
                
                <a id="btn-whatsapp" href="https://wa.me/5491112345678" target="_blank" rel="noopener noreferrer" class="btn-social btn-whatsapp">

                </a>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>La Pescadería Fish Market &copy; 2026</p>
        </div>
    </footer>

    <script src="script.js?v=2"></script>
</body>
</html>
